name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  MONGODB_URI: mongodb://localhost:27017/ci
  JWT_SECRET: ci-only-secret
  TEST_USERNAME: citester
  TEST_PASSWORD: Travel#2026ok

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7 # mongo 8 refuses to start on the runner's Linux 6.19+ kernel (SERVER-121912)
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile --dir server
      - run: tests/start-server.sh
      - run: pnpm test:integration
      - if: failure()
        run: cat server.log

  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7 # mongo 8 refuses to start on the runner's Linux 6.19+ kernel (SERVER-121912)
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile --dir server
      - run: pnpm exec playwright install --with-deps chromium
      - run: tests/start-server.sh
      - run: pnpm test:e2e
      - if: failure()
        run: cat server.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
